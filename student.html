<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | KhelSetu</title>
    <!-- Links to your global dark theme -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar bg-secondary">
        <div class="nav-brand">
            <h1 class="text-primary">KhelSetu</h1>
        </div>
        <div class="nav-user-controls">
            <span id="student-email" class="text-muted">Loading user...</span>
            <button id="theme-toggle" class="btn-secondary">🌙</button>
            <button id="logout-btn" class="btn-secondary">Logout</button>
        </div>
    </header>

    <!-- Main Dashboard Layout -->
    <main class="dashboard-container">
        
        <!-- Left/Main Column: Booking Interface -->
        <section class="booking-interface bg-secondary card">
            <h2 class="text-primary">Book a Facility</h2>
            
            <!-- Facility Selector -->
            <div class="selector-group">
                <label for="facility-dropdown" class="text-muted">Choose Sport/Facility:</label>
                <select id="facility-dropdown" class="bg-base text-primary">
                    <option value="" disabled selected>Select a facility...</option>
                    <!-- Options will be auto-populated by booking.js -->
                </select>
            </div>

            <!-- Dynamic Time Grid -->
            <div class="time-grid-container">
                <h3 class="text-primary">Available Time Slots</h3>
                <div id="time-grid" class="grid">
                    <!-- Buttons generated by booking.js will appear here -->
                    <!-- Example structure of a generated button: -->
                    <!-- <button class="slot-btn btn-primary" data-time="10:00">10:00 AM - 11:00 AM</button> -->
                </div>
            </div>
            
            <!-- Action Area -->
            <div class="booking-action">
                <button id="confirm-booking-btn" class="btn-primary" disabled>Confirm Booking</button>
            </div>
        </section>

        <!-- Right/Side Column: Active Bookings -->
        <aside class="my-bookings bg-secondary card">
            <h2 class="text-primary">My Bookings</h2>
            
            <div id="active-bookings-list" class="booking-list">
                <!-- Example of an injected booking item -->
                <!-- 
                <div class="booking-item bg-base">
                    <p class="text-primary">Main Cricket Ground</p>
                    <p class="text-muted">10:00 AM - 11:00 AM</p>
                    <span class="status-badge text-muted">Status: Awaiting Admin Confirmation</span>
                </div>
                -->
            </div>
        </aside>

    </main>

    <!-- Project JavaScript Files -->
    <script type="module" src="js/firebase-init.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/booking.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
